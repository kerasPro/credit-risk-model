[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "credit_risk_model"
version = "0.0.1"
description = "A model to predict credit default risk using LendingClub data"
authors = [
  { name = "Ronaldo David Cornejo Valencia" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "dagshub>=0.6.3",
    "ipykernel>=7.1.0",
    "jupyter-client>=8.6.3",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "mlflow<3",
    "numpy>=2.3.4",
    "optuna>=4.5.0",
    "pandas>=2.3.3",
    "pip",
    "protobuf==3.20.3",
    "pyarrow>=22.0.0",
    "python-dotenv",
    "ruff",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "shap>=0.49.1",
    "tqdm",
    "typer",
    "xgboost==3.0.5",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["credit_risk_model"]
include = ["pyproject.toml", "credit_risk_model/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["credit_risk_model"]
force-sort-within-sections = true

